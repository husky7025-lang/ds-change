<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>이동 중...</title>
  <script>
    // GitHub Pages 루트 접속 시 대문자 Index.html로 즉각 이동
    var path = window.location.pathname;
    if (!path.endsWith("/Index.html")) {
      var base = path.replace(/\/+$/, "");
      window.location.replace(base + "/Index.html" + window.location.search + window.location.hash);
    }
  </script>
  <meta http-equiv="refresh" content="0; url=Index.html">
</head>
<body>
  <p style="text-align:center; padding-top:50px; font-family:sans-serif; color:#666;">
    수업(교체ㆍ보강) 계획서 시스템으로 이동 중입니다...
  </p>
</body>
</html>
